[package]
name = "pmc_explorer"
version = "0.1.0"
edition = "2024"
description = "Search PubMed Central and open or save NCBI PDFs"

[dependencies]
eframe = "0.34"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
roxmltree = "0.21.1"
rfd = "0.15"
directories = "6"
